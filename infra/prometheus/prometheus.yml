global: { scrape_interval: 5s }
rule_files: [/etc/prometheus/rules.yml]
scrape_configs:
  - job_name: voxa-agent
    # DNS service discovery: every replica of the agent service is scraped (docker compose --scale agent=N)
    dns_sd_configs:
      - names: [agent]
        type: A
        port: 9100
        refresh_interval: 5s
