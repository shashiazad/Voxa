{{- if .Values.coturn.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .Release.Name }}-coturn }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: coturn } }
  template:
    metadata:
      labels:
        {{- include "voxa.labels" . | nindent 8 }}
        app.kubernetes.io/component: coturn
    spec:
      containers:
        - name: coturn
          image: {{ .Values.coturn.image }}
          args:
            - -n
            - --lt-cred-mech
            - --fingerprint
            - --realm={{ .Values.coturn.realm }}
            - --no-cli
            - --no-multicast-peers
            - --min-port=49160
            - --max-port=49200
            {{- if .Values.coturn.externalIp }}
            - --external-ip={{ .Values.coturn.externalIp }}
            {{- end }}
            - --user=$(TURN_USER):$(TURN_PASSWORD)
          env:
            - { name: TURN_USER, value: {{ .Values.coturn.user | quote }} }
            - name: TURN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: TURN_PASSWORD } }
          ports: [{ containerPort: 3478, protocol: UDP }, { containerPort: 3478, protocol: TCP }]
          resources: { requests: { cpu: 100m, memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-coturn }
spec:
  type: {{ .Values.coturn.service.type }}
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: coturn }
  ports:
    - { name: turn-udp, port: 3478, protocol: UDP }
    - { name: turn-tcp, port: 3478, protocol: TCP }
{{- end }}
