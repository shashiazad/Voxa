{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls: [{ hosts: [{{ .Values.ingress.apiHost }}, {{ .Values.ingress.webHost }}], secretName: {{ .Values.ingress.tls.secretName }} }]
  rules:
    - host: {{ .Values.ingress.apiHost }}
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-api, port: { number: 8000 } } } }] }
    - host: {{ .Values.ingress.webHost }}
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-web, port: { number: 3000 } } } }] }
{{- end }}
