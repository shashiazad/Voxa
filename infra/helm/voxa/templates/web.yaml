apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "voxa.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web } }
  template:
    metadata:
      labels:
        {{- include "voxa.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: {{ include "voxa.image" (dict "root" . "name" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 3000, name: http }]
          env:
            - { name: API_URL, value: "http://{{ .Release.Name }}-api:8000" }
            - { name: COOKIE_SECURE, value: "1" }
          readinessProbe: { httpGet: { path: /login, port: http }, periodSeconds: 5 }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          {{- include "voxa.secCtx" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-web }
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  ports: [{ port: 3000, targetPort: http, name: http }]
