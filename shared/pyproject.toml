[project]
name = "voxa-shared"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.14.1", "pyyaml==6.0.3", "jinja2==3.1.6", "asyncpg==0.32.0", "pgvector==0.5.1",
  "cryptography==50.0.2", "fastembed==0.9.0", "numpy>=2.0", "redis==8.1.0", "httpx==0.28.1",
  "pypdf==6.21.2", "boto3==1.43.118", "python-docx==1.2.0", "beautifulsoup4==4.15.0",
]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["voxa_shared*"]
[tool.setuptools.package-data]
voxa_shared = ["migrations/*.sql"]
